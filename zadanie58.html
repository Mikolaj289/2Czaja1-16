<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Zadanie 58</title>
</head>
<body>

<h2>Zadanie 58</h2>

<p>
    Pierwsza liczba:
    <input type="number" id="a">
</p>

<p>
    Druga liczba:
    <input type="number" id="b">
</p>

<button onclick="pokaz()">Pokaż</button>

<div id="wynik"></div>

<script>
function pokaz() {

    let a_cza = Number(document.getElementById("a").value);
    let b_cza = Number(document.getElementById("b").value);

    let wynik_cza = document.getElementById("wynik");
    let liczby_cza = [];

    if (a_cza == b_cza) {
        wynik_cza.innerHTML = "Pierwsza liczba jest równa drugiej. Brak obliczeń.";
        wynik_cza.style.color = "black";
        return;
    }

    if (a_cza < b_cza) {

        for (let i_cza = a_cza; i_cza <= b_cza; i_cza++) {
            if (i_cza % 2 != 0) {
                liczby_cza.push(i_cza);
            }
        }

        wynik_cza.style.color = "green";

    } else {

        for (let i_cza = a_cza; i_cza >= b_cza; i_cza--) {
            if (i_cza % 2 != 0) {
                liczby_cza.push(i_cza);
            }
        }

        wynik_cza.style.color = "blue";
    }

    wynik_cza.innerHTML = liczby_cza.join(", ");
}
</script>

</body>
</html>
