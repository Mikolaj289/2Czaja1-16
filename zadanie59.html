<html>
<html>
<body>

<div id="out"></div>

<script>
let a_cza = parseInt(prompt("Pierwsza liczba"));
let b_cza = parseInt(prompt("Druga liczba"));

let out_cza = document.getElementById("out");

if (a_cza == b_cza) {
    alert("Liczby są równe - brak obliczeń");
} 
else if (a_cza < b_cza) {
    for (let i_cza = a_cza; i_cza <= b_cza; i_cza++) {
        if (i_cza % 2 != 0) {
            out_cza.innerHTML += "<span style='color:green'>" + i_cza + "</span><br>";
        }
    }
} 
else {
    for (let i_cza = a_cza; i_cza >= b_cza; i_cza--) {
        if (i_cza % 2 != 0) {
            out_cza.innerHTML += "<span style='color:blue;font-size:10px'>" + i_cza + "</span><br>";
        }
    }
}
</script>

</body>
</html>
