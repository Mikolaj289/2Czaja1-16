<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zadanie58</title>
</head>
<body>
<pre id="output_cza"></pre>

<script>
let numer_cza = Number(prompt("Podaj numer w dzienniku"));
let wynik_cza = "";

for (let i_cza = numer_cza; i_cza <= numer_cza + 15; i_cza++) {
    let pierw_2_cza = Math.sqrt(i_cza);
    let pierw_4_cza = Math.sqrt(pierw_2_cza);

    wynik_cza +=
        "l=" + i_cza +
        "    pierw_2(" + i_cza + ")=" + pierw_2_cza.toFixed(2) +
        "    pierw_4(" + i_cza + ")=" + pierw_4_cza.toFixed(2) +
        "\n";
}

document.getElementById("output_cza").textContent = wynik_cza;
console.log(wynik_cza);
</script>
</body>
</html>
