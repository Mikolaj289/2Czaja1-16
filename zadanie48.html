<!DOCTYPE html>
<head>
<meta charset="utf-8">
</head>

<body>

<div style="color:red;font-size:50px;">

<script language="JavaScript">

do {
    var a_cza = parseFloat(prompt("Podaj bok a =", ""));
    var b_cza = parseFloat(prompt("Podaj bok b =", ""));
    var c_cza = parseFloat(prompt("Podaj bok c =", ""));
}
while (!(a_cza > 0 && b_cza > 0 && c_cza > 0 &&
         a_cza + b_cza > c_cza &&
         a_cza + c_cza > b_cza &&
         b_cza + c_cza > a_cza));

document.write("Boki tworzą trójkąt<br>");

</script>

</div>

</body>
</html>
