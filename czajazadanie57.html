<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obliczenia JavaScript</title>
</head>
<body>
<h1>Wyniki obliczeń</h1>
<pre id="output"></pre>

<script>
let liczenie = 0;
let wynik = "";

for (let i = 0; i < 40; i++) {
    let w = i * i + i + 41;

    wynik += "i=" + i + "    w(" + i + ")=" + w + "\n";

    liczenie++;

    if (liczenie == 5) {
        wynik += "----------------\n";
        liczenie = 0;
    }
}

document.getElementById("output").textContent = wynik;
console.log(wynik);
</script>
</body>
</html>
