<html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zadanie57</title>
</head>
<body>
<pre id="output_cza"></pre>

<script>
let liczenie_cza = 0;
let wynik_cza = "";

for (let i_cza = 0; i_cza < 40; i_cza++) {
    let w_cza = i_cza * i_cza + i_cza + 41;

    wynik_cza += "i=" + i_cza + "    w(" + i_cza + ")=" + w_cza + "\n";

    liczenie_cza++;

    if (liczenie_cza == 5) {
        wynik_cza += "----------------\n";
        liczenie_cza = 0;
    }
}

document.getElementById("output_cza").textContent = wynik_cza;
console.log(wynik_cza);
</script>
</body>
</html>
